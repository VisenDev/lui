<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUI — MiriCL</title>
  <style>body { margin: 0; }</style>
</head>
<body>
<script type="module">
  import {Miricl} from './miricl.js';
  try {
    const fetchBytes = async name => {
      const response = await fetch(name);
      if (!response.ok) throw new Error(`${name}: HTTP ${response.status}`);
      return response.arrayBuffer();
    };
    const [runtime, application] = await Promise.all([
      fetchBytes('./miricl.wasm'), fetchBytes('./lui.wasm')
    ]);
    const lisp = await Miricl.instantiate(runtime);
    lisp.mountFile('/lui.wasm', application);
    window.luiEvaluate = source => lisp.evaluate(source, {eof: true}).output;
    window.luiEvaluate('(load "/lui.wasm") (lui.example:main)');
  } catch (error) {
    document.body.textContent = `Unable to start LUI: ${error.message}`;
    throw error;
  }
</script>
</body>
</html>
